<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Build It Like You Won't Be There Tomorrow</title>
  <desc id="desc">Operational readiness and handoff standards by David Schunk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26323b"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="8" height="280" rx="4" fill="#4f8f77"/>
  <text x="70" y="76" fill="#91b9aa" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">RUNBOOKS · HANDOFF · RECOVERY · CHANGE · OPERATIONAL READINESS</text>
  <text x="68" y="145" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="750">Build It Like You Won't Be There Tomorrow</text>
  <text x="70" y="193" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Reusable standards for systems the next engineer can safely inherit</text>
  <line x1="70" y1="222" x2="1130" y2="222" stroke="#fff" stroke-opacity=".14"/>
  <text x="70" y="253" fill="#aeb9c6" font-family="Segoe UI, Arial, sans-serif" font-size="15">Ownership. Observability. Recovery. Documentation. Handoff.</text>
</svg>